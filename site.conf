# =============================================================================
#  Configuration du site proximas.be : LE SEUL FICHIER A REMPLIR.
# =============================================================================
#  Format : « cle = valeur », une par ligne. Les lignes qui commencent par # sont
#  des commentaires. Pas de guillemets. Les cles _fr et _en sont les deux langues
#  d'une meme information : remplis les deux.
#
#  - Un champ obligatoire laisse vide s'affiche « [À REMPLIR] » (en anglais
#    « [TO BE COMPLETED] ») sur le site. Rien n'est jamais invente.
#  - Voir ce qui manque :   make champs      (ou : go run . champs)
#  - Ce fichier est PUBLIC (tout ce qu'il contient finit sur le site) et integre
#    au programme a la compilation : apres une modification, commit, push, puis
#    deploy/build-prod.sh sur le serveur. Aucun mot de passe ni cle ici.
#
#  Source des valeurs deja remplies (26/11/2026) : mentions legales publiees sur
#  eliajin.be et eliagames.be, reponses du proprietaire.
# =============================================================================

# Adresse publique du site (https, sans barre finale). « www. » redirige dessus.
url_site = https://proximas.be

# Date des textes affichee sur les pages legales (AAAA-MM-JJ). A changer a chaque
# modification d'un texte legal.
date_textes = 2026-11-26

