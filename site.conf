# textes (content/*/confidentialite.html).
zone_fr = Union européenne, Islande, Norvège, Liechtenstein et Suisse
zone_en = European Union, Iceland, Norway, Liechtenstein and Switzerland

# --- Beta (facultatif : un lien vide reste masque) ---------------------------
# Lien du groupe Google des testeurs Android (https://...).
lien_groupe_google =
# Lien public TestFlight pour iPhone (https://testflight.apple.com/...).
lien_testflight =
# ATTENTION avant de remplir : tant que l'age n'est que declare et l'inscription
# ouverte, la diffusion de l'application est la seule barriere (voir ProximaS,
# docs/STORES.md).

# --- Etat reel de l'application : les textes legaux en dependent -------------
# Ne passe a « oui » que ce qui est EN SERVICE (deploye ou distribue). Voir
# docs/MISE_EN_LIGNE.md, « Quand le lot 5 est deploye ».

# « oui » quand l'API du lot 5 est deployee : suppression avec 14 jours de
# retractation, nouvelles purges automatiques, empreinte des adresses bannies.
lot5_serveur_deploye = non
# « oui » quand la version de l'app avec « Supprimer mon compte » est distribuee.
suppression_dans_app = non
# « oui » quand la version de l'app avec « Telecharger mes donnees » est distribuee.
export_dans_app = non
# Page web de demande de suppression. Vide = demande par e-mail seulement.
# Apres deploiement : https://api.proximas.be/suppression-compte
suppression_web_url =

# « oui » seulement si TEXT_FILTER_PRIVATE=on dans le .env de l'API (messages et
# signaux alors reperes automatiquement). La prod doit etre a « off ».
relecture_messages_prives = non

# « oui » quand l'application elle-meme est disponible en anglais.
app_en_anglais = non
