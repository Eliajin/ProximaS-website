# Prestataire qui heberge cette boite e-mail (il recoit les demandes envoyees a
# contact@). Exemple de forme : « Nom de la societe (pays) ».
fournisseur_boite_contact_fr = Google (Gmail), après redirection par Cloudflare Email Routing
fournisseur_boite_contact_en = Google (Gmail), after forwarding by Cloudflare Email Routing

# Delegue a la protection des donnees : adresse ou nom, ou le mot « aucun » si tu
# n'en designes pas (a faire valider : article 37 du RGPD, donnees sensibles).
dpo = aucun

# --- Hebergement -------------------------------------------------------------
hebergeur_nom_fr = Eliajin (infrastructure auto-hébergée)
hebergeur_nom_en = Eliajin (self-hosted infrastructure)
hebergeur_description_fr = Serveur exploité par l'éditeur lui-même, en Belgique.
hebergeur_description_en = Server operated by the publisher himself, in Belgium.
hebergeur_responsable_technique = Antoine Brichard

# --- Zone de lancement -------------------------------------------------------
# Pays ou le service est propose. Modifier ici suffit (decision du 26/11/2026 ;
