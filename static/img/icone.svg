<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône ProximaS (principale, variante violette), recréée en vectoriel d'après design/marque/planche-de-marque.png.
  Plein cadre, SANS coins arrondis ni bords en verre : le système (iOS, Android, magasins) applique son propre masque.
  Fond dégradé violet foncé, deux orbites elliptiques rose vers bleu autour d'une étoile blanche à 4 branches.
  Les orbites restent dans un rayon de 370 px autour du centre (iOS) ; la version Android adaptive est icone-foreground.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8A3DF0"/>
      <stop offset="0.45" stop-color="#4B22B4"/>
      <stop offset="1" stop-color="#150C52"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#9A6BFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9A6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitBlue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A06BFF"/>
      <stop offset="0.55" stop-color="#6F8CFF"/>
      <stop offset="1" stop-color="#58CBFF"/>
    </linearGradient>
    <linearGradient id="orbitPink" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7A63FF"/>
      <stop offset="0.5" stop-color="#C46BFF"/>
      <stop offset="1" stop-color="#FF86E6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#FFD6F5" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#C97BFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C97BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowBg)"/>

  <!-- Marque : agrandie de 12 % par rapport à la zone sûre Android (rayon utile 370 px). -->
  <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
    <!-- Orbite 1 : croissant épais en haut à droite (bleu). Anneau = grande ellipse moins une ellipse décalée. -->
    <g transform="rotate(-30 512 512)">
      <path fill="url(#orbitBlue)" fill-rule="evenodd"
        d="M 177 512 a 335 175 0 1 0 670 0 a 335 175 0 1 0 -670 0 Z
           M 180.5 512 a 313 166 0 1 0 626 0 a 313 166 0 1 0 -626 0 Z"/>
    </g>
    <!-- Orbite 2 : croissant épais en haut à gauche (rose), symétrique. -->
    <g transform="rotate(30 512 512)">
      <path fill="url(#orbitPink)" fill-rule="evenodd"
        d="M 177 512 a 335 175 0 1 0 670 0 a 335 175 0 1 0 -670 0 Z
           M 843.5 512 a 313 166 0 1 0 -626 0 a 313 166 0 1 0 626 0 Z"/>
    </g>

    <!-- Étoile à 4 branches, léger halo. -->
    <circle cx="512" cy="512" r="180" fill="url(#halo)"/>
    <path fill="#FFFFFF"
      d="M 512 412 Q 521 503 612 512 Q 521 521 512 612 Q 503 521 412 512 Q 503 503 512 412 Z"/>
  </g>
</svg>
